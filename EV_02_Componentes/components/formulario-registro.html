<section class="form-section" id="registro">
    <h2>Registro e Ingreso de Medicamentos</h2>
    <form id="formInventario" class="form-grid">
        <div class="form-group">
            <label for="codigoSku">Código SKU / Barras:</label>
            <input type="text" id="codigoSku" name="codigoSku" placeholder="Ej. 770123456789" required>
        </div>
        <div class="form-group">
            <label for="nombreProducto">Nombre Comercial del Producto:</label>
            <input type="text" id="nombreProducto" name="nombreProducto" placeholder="Nombre completo" required>
        </div>
        <div class="form-group">
            <label for="cantidadStock">Cantidad Inicial:</label>
            <input type="number" id="cantidadStock" name="cantidadStock" min="1" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Guardar Medicamento</button>
        </div>
    </form>
</section>
