<!-- card-producto.html -->
<article class="product-card">
  <div class="card-image-container">
    <img src="img/producto-ejemplo.jpg" alt="Imagen del Producto" class="card-image">
    <span class="card-badge">Nuevo</span>
  </div>
  <div class="card-content">
    <h3 class="card-title">Acetaminofén 500mg</h3>
    <p class="card-description">Caja x 20 tabletas. Analgésico y antipirético de rápida acción.</p>
    <div class="card-footer-info">
      <span class="card-price">$ 8.500 COP</span>
      <button type="button" class="btn btn-primary">Agregar al Carrito</button>
    </div>
  </div>
</article>
